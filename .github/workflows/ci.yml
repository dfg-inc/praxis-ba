name: Praxis BA CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ba-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run plugins:validate
      - run: npm run check:skill-cli
      - run: npm run check:boundaries


  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run accept:ba-diagnostics
      - run: npm run accept:ba-outcomes

  pack_zip:
    runs-on: ubuntu-latest
    needs: [validate, acceptance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run pack:zip
      - run: npm run accept:claude-plugins
      - name: Checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          paths = list(pathlib.Path("dist/claude-plugins").rglob("praxis-ba.zip"))
          assert paths, "praxis-ba.zip missing"
          rows = [{"file": str(p), "sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "bytes": p.stat().st_size} for p in paths]
          pathlib.Path("dist/zip-checksums.json").write_text(json.dumps(rows, indent=2) + "\n")
          print(rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: praxis-ba-zip
          path: |
            dist/claude-plugins/
            dist/zip-checksums.json
